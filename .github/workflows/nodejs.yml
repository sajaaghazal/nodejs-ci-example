name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm install
    - name: Run tests
      run: npm test

  deploy-to-staging:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: Staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Simulate deployment to Staging
        run: |
          echo "Deploying application to Staging environment..."
          echo "Application version: $(git rev-parse --short HEAD)"
          echo "Deployment to Staging successful!"

  deploy-to-production:
    needs: deploy-to-staging
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Simulate deployment to Production
        run: |
          echo "Deploying application to Production environment..."
          echo "Application version: $(git rev-parse --short HEAD)"
      - name: Simulated health check
        run: |
          echo "Running health checks..."
          echo "Health endpoint: https://yourapp.com/health (simulated)"
          
          # Simulate a random health check result (50% pass, 50% fail)
          if [ $((RANDOM % 2)) -eq 0 ]; then
            echo "✅ Health check passed!"
            echo "Deployment to Production successful!"
          else
            echo "❌ Simulated health check failure!"
            echo "HTTP 500 - Service Unhealthy"
            echo "Error: Exit with non-zero code to trigger rollback"
            exit 1
          fi